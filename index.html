<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#14081d" />
  <title>New Era for the Myriad Souls — Endfield Sauin Film Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a0b24'/%3E%3Ccircle cx='32' cy='36' r='19' fill='%23ff8c2a'/%3E%3Cpath d='M28 15c1-5 6-6 8-2' stroke='%235ad67d' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpolygon points='23,31 28,25 30,33' fill='%231a0b24'/%3E%3Cpolygon points='41,31 36,25 34,33' fill='%231a0b24'/%3E%3Cpath d='M22 41c5 5 15 5 20 0' stroke='%231a0b24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :where(*, *::before, *::after) {
      box-sizing: border-box;
    }
    :where(html, body) {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #2b1338 0%, #14081d 68%, #09040e 100%);
      color: #f9efe0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    :where(#stage-mount) {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }
    :where(#stage-mount canvas) {
      display: block;
      width: 100%;
      height: 100%;
    }
    :where(#ui-root) {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }
    :where(#title) {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      pointer-events: auto;
      text-align: center;
    }
    :where(.boot-title-topbar) {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    :where(.boot-studio-badge) {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(20, 8, 29, 0.78);
      border: 1px solid rgba(255, 206, 122, 0.45);
      color: #ffd88a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    :where(.boot-top-controls) {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    :where(.boot-crest) {
      max-width: 680px;
      padding: 18px 24px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(35, 14, 48, 0.84) 0%, rgba(16, 7, 24, 0.88) 100%);
      border: 2px solid rgba(255, 198, 109, 0.55);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
    }
    :where(.boot-eyebrow) {
      color: #ff9f4a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    :where(.boot-heading) {
      margin: 0;
      font-size: clamp(22px, 4.2vw, 42px);
      line-height: 1.12;
      font-weight: 900;
      color: #fff5e4;
      text-shadow: 0 3px 14px rgba(255, 123, 54, 0.45);
    }
    :where(.boot-subtitle) {
      margin: 8px auto 0;
      max-width: 520px;
      font-size: clamp(12px, 1.8vw, 15px);
      line-height: 1.4;
      color: #e6d5c3;
    }
    :where(.boot-cta-row) {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }
    :where(.boot-btn) {
      min-width: 84px;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 210, 140, 0.55);
      background: rgba(28, 13, 40, 0.9);
      color: #fbeed9;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
    }
    :where(.boot-btn-primary) {
      min-width: 184px;
      min-height: 54px;
      padding: 12px 26px;
      background: linear-gradient(180deg, #e63e31 0%, #b51f1c 100%);
      border-color: #ffd584;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.03em;
      box-shadow: 0 8px 24px rgba(220, 48, 36, 0.48);
    }
  </style>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="stage-mount" aria-hidden="true"></div>

  <div id="ui-root">
    <section id="title" class="title-view title-screen" data-view="title" aria-label="New Era for the Myriad Souls Title Screen">
      <header class="boot-title-topbar">
        <div class="boot-studio-badge">Endfield Sauin Film Studio</div>
        <div class="boot-top-controls">
          <button type="button" id="btn-title-bgm" class="boot-btn" data-boot-action="toggle-bgm" aria-label="Toggle Background Music">Music: ON</button>
          <button type="button" id="btn-title-vo" class="boot-btn" data-boot-action="toggle-vo" aria-label="Toggle Voiceover">Voice: ON</button>
          <button type="button" id="btn-title-guide" class="boot-btn" data-boot-action="guide" aria-label="Open Studio Guide">Guide ?</button>
        </div>
      </header>

      <div class="boot-crest">
        <div class="boot-eyebrow">All Souls' Eve Promo Shoot</div>
        <h1 class="boot-heading">New Era for the Myriad Souls</h1>
        <p class="boot-subtitle">For the myriad souls, and for us—a new era of light and shadow.</p>
      </div>

      <footer class="boot-cta-row">
        <button type="button" id="btn-title-album" class="boot-btn" data-boot-action="album">Film Album</button>
        <button type="button" id="btn-start-filming" class="boot-btn boot-btn-primary" data-boot-action="start">Start Filming</button>
        <button type="button" id="btn-title-rewards" class="boot-btn" data-boot-action="rewards">Event Rewards</button>
      </footer>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
